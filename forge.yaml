# Local Forge config for Learning Guide. Do not live-apply to this repo.
# Adopter thin file only — do not vendor forge/.
schema: forge-config/v1
protect:
  - main
agent_branch_prefixes:
  - cursor/
  - copilot/
deny_paths:
  - .github/workflows/ci.yml
  - .github/workflows/apprunner-deploy.yml
  - .github/workflows/overlay-check.yml
required_checks:
  - Typecheck
  - Lint
  - Build and test
  - overlay-check
review:
  min_approvals: 1
  code_owners: false
